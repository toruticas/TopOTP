[package]
name = "topotp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "macOS menu bar authenticator"
default-run = "topotp"

[lib]
name = "topotp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "topotp"
path = "src/main.rs"

[[bin]]
name = "keychain-probe"
path = "src/bin/keychain_probe.rs"
required-features = ["native-probe"]

[[bin]]
name = "generate-bindings"
path = "src/bin/generate_bindings.rs"
required-features = ["codegen"]

[features]
native-probe = []
codegen = []
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive", "serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
argon2 = "0.5"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
base64 = "0.22"
rand = "0.8"
ts-rs = "12"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
objc2-security = "0.3"
objc2-core-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
