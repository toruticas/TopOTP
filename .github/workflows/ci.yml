name: macOS checks and local bundles
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: rustup show
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:rust
      - run: npm run check:rust
      - run: npm run format:rust
      - run: npm run test:e2e
  bundle:
    needs: verify
    runs-on: macos-15
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: rustup target add "${{ matrix.target }}"
      - run: npm run tauri:build -- --target "${{ matrix.target }}" --ci
      - run: python3 scripts/inspect-release.py "src-tauri/target/${{ matrix.target }}/release/bundle/macos/TopOTP.app"
      - run: tar -cf "topotp-${{ matrix.target }}.tar" -C "src-tauri/target/${{ matrix.target }}/release/bundle" macos dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: topotp-${{ matrix.target }}
          path: topotp-${{ matrix.target }}.tar
          retention-days: 7
