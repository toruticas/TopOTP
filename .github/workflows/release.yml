name: Publish macOS release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  bundle:
    needs: checks
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            architecture: arm64
          - target: x86_64-apple-darwin
            architecture: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: rustup target add "${{ matrix.target }}"
      - run: npm run tauri:build -- --target "${{ matrix.target }}" --ci
      - run: python3 scripts/inspect-release.py "src-tauri/target/${{ matrix.target }}/release/bundle/macos/TopOTP.app"
      - name: Verify target architecture
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          actual=$(lipo -archs "src-tauri/target/$RELEASE_TARGET/release/bundle/macos/TopOTP.app/Contents/MacOS/topotp")
          test "$actual" = "$RELEASE_ARCHITECTURE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: topotp-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: topotp-*
          path: release-assets
          merge-multiple: true
      - name: Validate assets and generate checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version), "A stable version is required"
          tag = f"v{version}"
          assert Path(f"docs/releases/{tag}.md").is_file()
          folder = Path("release-assets")
          expected = {f"TopOTP_{version}_{arch}.dmg" for arch in ("aarch64", "x64")}
          assert {p.name for p in folder.iterdir()} == expected, "Unexpected release assets"
          checksums = []
          for name in sorted(expected):
              path = folder / name
              assert path.is_file() and path.stat().st_size > 0
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksums.append(f"{digest}  {name}\n")
          (folder / "SHA256SUMS").write_text("".join(checksums))
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write(f"RELEASE_TAG={tag}\n")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG")
          existing=$(printf '%s' "$refs" | python3 -c 'import json,os,sys; print(next((r["object"]["sha"] for r in json.load(sys.stdin) if r["ref"] == "refs/tags/" + os.environ["RELEASE_TAG"]), ""))')
          if [ -n "$existing" ]; then
            test "$existing" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA" > /dev/null
          fi
          gh release create "$RELEASE_TAG" release-assets/*.dmg release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "TopOTP $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
